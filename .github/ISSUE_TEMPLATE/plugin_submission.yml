name: Plugin Submission
description: Submit a new plugin to the marketplace
title: "[Plugin]: "
labels: ["plugin-submission", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a plugin! Please provide information about your plugin below.

        **Note**: Make sure you've read [CONTRIBUTING.md](../../CONTRIBUTING.md) before submitting.

  - type: input
    id: plugin-name
    attributes:
      label: Plugin Name
      description: The name of your plugin (kebab-case)
      placeholder: my-awesome-plugin
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Plugin Description
      description: A clear description of what your plugin does
      placeholder: This plugin provides functionality for [...]
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Initial version (should be 1.0.0 for new plugins)
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author
      description: Your name or GitHub username
      placeholder: Your Name
    validations:
      required: true

  - type: textarea
    id: components
    attributes:
      label: Components
      description: List the components included in your plugin
      placeholder: |
        - Skills: [skill-name-1, skill-name-2]
        - Commands: [command-1, command-2]
        - Hooks: [yes/no]
        - MCPs: [yes/no]
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe the main use cases for your plugin
      placeholder: |
        1. Use case 1: [description]
        2. Use case 2: [description]
    validations:
      required: true

  - type: input
    id: pr-link
    attributes:
      label: Pull Request Link
      description: Link to your pull request (if already created)
      placeholder: https://github.com/thoeltig/claude-code-toolkit/pull/123
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      description: Please confirm you've completed the following
      options:
        - label: Plugin follows Claude Code specifications (valid plugin.json, proper directory structure)
          required: true
        - label: All SKILL.md files have proper YAML frontmatter
          required: true
        - label: Skills are under 500 lines (or use progressive disclosure)
          required: true
        - label: Plugin includes README.md with installation instructions
          required: true
        - label: Plugin includes CHANGELOG.md following Keep a Changelog format
          required: true
        - label: No hardcoded personal information or absolute paths
          required: true
        - label: All components have been tested
          required: true
        - label: Documentation includes usage examples
          required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other information about your plugin
      placeholder: Additional details
    validations:
      required: false
